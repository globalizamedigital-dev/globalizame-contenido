<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>video-pizarra</title>
<style>
@font-face{font-family:Caveat;font-weight:700;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Caveat;font-weight:600;src:url(node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Kalam;font-weight:400;src:url(node_modules/@fontsource/kalam/files/kalam-latin-400-normal.woff2) format("woff2")}

@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format("woff2")}

</style>
<style>
  html,body{margin:0;height:100%;background:#1b1b1b;overflow:hidden}
  #wrap{position:absolute;inset:0;display:grid;place-items:center}
  svg#stage{display:block;transform-origin:center}
  body.preview svg#stage{transform:scale(var(--k,0.45))}
  .hand{font-family:Caveat,"Comic Sans MS",cursive;font-weight:700}
  .kalam{font-family:Kalam,"Comic Sans MS",cursive}
  .code{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500}
</style>
</head>
<body>
<div id="wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
